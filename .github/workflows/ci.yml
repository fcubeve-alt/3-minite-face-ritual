name: CI

# 两层：
#  1. checks —— Ubuntu，不需要 Xcode。开发机是 Windows，日常靠它兜底。
#  2. macos  —— 真实编译 + 单元测试 + 模拟器上的 M1 闭环。
#
# 刻意只用**一个** macOS 任务：私有仓库的 macOS 机器按 10 倍分钟计费，
# 拆成「构建 / 单测 / UI 测试」三个任务会白白多花两倍额度，
# 而它们本来就共用同一份编译产物。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 离线检查（架构 / 内容 / 几何）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 架构约束与静态检查
        run: python tools/check_architecture.py

      - name: Swift 引用检查
        # 先跑自测：一个从不报错的检查器比没有更糟。
        run: |
          python tools/check_swift_refs.py --self-test
          python tools/check_swift_refs.py

      - name: 内容包校验
        run: python tools/validate_content.py

      - name: Golden vectors 是否最新
        # 改了 anchors.json 却忘了重新生成 golden，会让 Swift 测试断言一份过期的期望值。
        run: python tools/golden/generate_golden.py --check

      - name: 无头跑一遍全部 routine
        # 验证每个播放段都能真的在脸上画出东西，以及左右两段互为镜像。
        run: python tools/simulate_routine.py

  macos:
    name: 编译 · 单元测试 · M1 闭环
    # macos-15 带 Xcode 16。XcodeGen 2.46 生成的是 objectVersion 77（Xcode 16 格式），
    # macos-14 上的 Xcode 15.4 会直接报 "future Xcode project file format (77)"。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: FaceRitualCore 单元测试
        # Core 是纯 Swift 包，不需要 Xcode 工程，最快的反馈回路。
        working-directory: Packages/FaceRitualCore
        run: swift test

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 选一台可用的 iOS 模拟器
        # 不写死机型名：不同 Xcode 版本预装的模拟器不一样，
        # 写死 "iPhone 15" 换个镜像就找不到设备了。
        id: sim
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "找不到可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "选中的模拟器 UDID: $UDID"

      # 模拟器没有摄像头 → provider 如实报告不可用 → 自动回落 Mock（合成动画脸）。
      # 于是「打开 App → START → 选模式 → 走完 routine → Done → 记录落盘」
      # 这条 M1 闭环每次推代码都被验证一遍，不需要任何人手里有 Mac。
      # 测不到的只有真人脸上的贴合精度 / FPS / 遮挡表现 —— 那些必须上真机。
      - name: 构建并跑全部测试（含 M1 闭环 UI 测试）
        run: |
          # pipefail 不能省：xcodebuild 的失败会被 tee 吞掉，
          # 上一版就因此在构建报错的情况下显示了绿色。
          set -o pipefail
          xcodebuild test \
            -project FaceRitual.xcodeproj \
            -scheme FaceRitual \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
