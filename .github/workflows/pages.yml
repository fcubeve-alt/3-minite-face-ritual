name: Pages

# 把两样东西发布到 GitHub Pages：
#   /            官网（落地页 + 隐私政策 + 支持页）—— 上架必需的两个网址就来自这里
#
# 原来这里还发布过一个 AR 概念验证原型。AR Mirror 于 2026-09-07 砍掉之后，
# 那个页面演示的是**已经不存在的功能** —— 继续挂着是误导，所以撤了。
#
# 首次使用需要在仓库 Settings → Pages → Source 里选 "GitHub Actions"（只需一次）。

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个发布，且不打断正在进行的那个 ——
# 半途取消会留下一个部署了一半的站点。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 网站文案不得出现功效表述
        run: python tools/check_architecture.py

      - name: 组装站点
        run: |
          set -o pipefail
          mkdir -p _site
          cp site/*.html _site/
          echo "已发布："
          find _site -type f -name '*.html' | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
