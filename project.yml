# XcodeGen 工程定义。
#
# 为什么用 XcodeGen 而不是提交 .xcodeproj：
# .pbxproj 是不可读、易冲突的生成物。用 yml 定义，工程结构可 review、可 diff、
# 多人协作不会撞车，也让「在 Windows 上写代码、在 Mac 上构建」成为可能。
#
# 生成方式：  make bootstrap    （或 brew install xcodegen && xcodegen generate）

name: FaceRitual
options:
  bundleIdPrefix: com.face3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 本机开发用自动签名（Xcode 里选自己的 Team 即可）。
    # CI 上传 TestFlight 时由命令行覆盖成手动签名 —— 见 .github/workflows/testflight.yml。
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 版本号。CI 会把 CURRENT_PROJECT_VERSION 覆盖成流水线编号 ——
    # TestFlight 要求同一个版本下的构建号必须递增且唯一。
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FaceRitualCore:
    path: Packages/FaceRitualCore

targets:
  FaceRitual:
    type: application
    platform: iOS
    sources:
      - path: App/FaceRitual
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FaceRitualCore
        product: FaceRitualCore
    info:
      path: App/FaceRitual/Resources/Info.plist
      properties:
        CFBundleDisplayName: face3
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        # 规格 §4：摄像头可选，且必须由用户主动开启。
        #
        # ⚠️ 待 Owner 与法务确认（规格 §19）。改动时必须同步 AppCopy.cameraNeededMessage ——
        # 系统弹窗与 App 内说法不一致，审核会当成误导。
        #
        # 「不离开设备」是经代码验证的事实：全工程无任何联网 API，
        # check_architecture.py 有一条规则锁住这个前提。
        NSCameraUsageDescription: >-
          AR Mirror uses the front camera to draw massage start points, end points and
          movement paths onto your own face. The camera runs only while AR Mirror is open.
          The video stays on your device — nothing is recorded, saved, or sent anywhere.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.face3.app
        TARGETED_DEVICE_FAMILY: "1"      # M1 只做 iPhone（是否首发仅 iPhone 待 Owner 确认）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # UI 测试跑在模拟器上。模拟器没有摄像头，provider 会自动回落到 Mock（合成脸），
  # 于是整条 M1 闭环——除了「真人脸」那一环——都能在 CI 上自动验证。
  FaceRitualUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/FaceRitualUITests
      # 控件标识两个 target 共用一份，避免字符串对不上导致测试静默失效
      - path: App/FaceRitual/Features/Components/A11yID.swift
    dependencies:
      - target: FaceRitual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.face3.app.uitests
        TEST_TARGET_NAME: FaceRitual

  FaceRitualTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/FaceRitualTests
    dependencies:
      - target: FaceRitual
      - package: FaceRitualCore
        product: FaceRitualCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.face3.app.tests

schemes:
  FaceRitual:
    build:
      targets:
        FaceRitual: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FaceRitualTests
        - FaceRitualUITests
