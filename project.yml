# XcodeGen 工程定义。
#
# 为什么用 XcodeGen 而不是提交 .xcodeproj：
# .pbxproj 是不可读、易冲突的生成物。用 yml 定义，工程结构可 review、可 diff、
# 多人协作不会撞车，也让「在 Windows 上写代码、在 Mac 上构建」成为可能。
#
# 生成方式：  make bootstrap    （或 brew install xcodegen && xcodegen generate）

name: FaceRitual
options:
  bundleIdPrefix: com.faceritual
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # Owner 在 Xcode 里填自己的 Team
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  FaceRitualCore:
    path: Packages/FaceRitualCore

targets:
  FaceRitual:
    type: application
    platform: iOS
    sources:
      - path: App/FaceRitual
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: FaceRitualCore
        product: FaceRitualCore
    info:
      path: App/FaceRitual/Resources/Info.plist
      properties:
        CFBundleDisplayName: Face Ritual
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        # 规格 §4：摄像头可选，且必须由用户主动开启。
        # 这段文案会出现在系统权限弹窗里，需 Owner 与法务确认最终措辞（规格 §19）。
        NSCameraUsageDescription: >-
          AR Mirror uses the front camera to show massage start points, end points
          and movement paths on your own face. The camera is only used while you
          have AR Mirror open, video never leaves your device, and nothing is recorded.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faceritual.app
        TARGETED_DEVICE_FAMILY: "1"      # M1 只做 iPhone（是否首发仅 iPhone 待 Owner 确认）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FaceRitualTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/FaceRitualTests
    dependencies:
      - target: FaceRitual
      - package: FaceRitualCore
        product: FaceRitualCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faceritual.app.tests

schemes:
  FaceRitual:
    build:
      targets:
        FaceRitual: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FaceRitualTests
